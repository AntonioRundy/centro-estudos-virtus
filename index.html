  <style>

/* Fitas reutilizáveis: máscara circular cria a concavidade sem clip-path. */

  content:"";position:absolute;z-index:1;left:-9px;top:50%;width:18px;height:18px;

}
.panel-title{font-size:13px}

      return '<div class="attendance-workspace"><div class="attendance-settings-panel panel"><div class="panel-head"><div><div class="panel-title">Critérios de «Outros»</div><div class="panel-note">Defina a carga letiva e o limite que anula esta componente.</div></div></div><div class="panel-body"><form id="attendance-settings-form" class="attendance-settings"><label class="field">Aulas previstas no semestre<input name="plannedLessons" type="number" min="1" max="400" step="1" required value="'+planned+'"></label><label class="field">Limite de faltas (% das aulas)<input name="absenceLimitPercent" type="number" min="1" max="100" step="1" required value="'+limitPercent+'"></label><button type="submit" class="btn btn-secondary btn-small">Guardar critérios</button></form><p class="hint">Com '+planned+' aulas e limite de '+limitPercent+'%, «Outros» fica a zero a partir de '+absenceLimit+' faltas.</p><div class="attendance-formula"><strong>Cálculo de «Outros»</strong><span>Presenças: até 10 valores, proporcional às aulas previstas.</span><span>Participação: até 10 valores, proporcional a 5 pontos por aula.</span><span>Se as faltas registadas atingirem o limite configurado, a nota de «Outros» é 0.</span></div></div></div><div class="panel attendance-create-panel"><div class="panel-head"><div><div class="panel-title">Nova aula</div><div class="panel-note">Cada registo representa um dia; por padrão, inclui duas aulas.</div></div></div><div class="panel-body"><form id="new-attendance-session-form" class="attendance-create-form"><label class="field">Data<input name="date" type="date" required value="'+today()+'"></label><label class="field">Tópico ou observação<input name="title" maxlength="120" placeholder="Ex.: Interpretação de perfis"></label><label class="field">Aulas neste dia<select name="periods"><option value="2" selected>2 aulas</option><option value="1">1 aula</option><option value="3">3 aulas</option><option value="4">4 aulas</option></select></label><button type="su     function renderLessons(isStudent){

in('');return '<section class="module-section"><div class="module-heading"><h2>'+esc(module.name)+'</h2><div class="module-heading-actions"><span class="pill gray">'+files.length+' ficheiro'+(files.length===1?'':'s')+'</span>'+(isStudent?'':'<button class="btn btn-quiet btn-small" data-action="edit-module" data-id="'+esc(module.id)+'">Editar</button>')+'</div></div><div class="file-list">'+(fileRows||'<div class="empty-inline">Ainda não há materiais neste módulo.</div>')+'</div></section>'}).join('');

      const materials=toolbar+(sections||'<div class="empty">Ainda não existem módulos de aula.</div>');

    function renderStudentHome(){
      const st=studentById(studentId);

      const classMatch=studentClass.match(/^(.*?)\s+(\d{4}\/\d{4})$/);
      const classLabel=classMatch?.[1]||studentClass||'—';
      const classYear=classMatch?.[2]||'';

      const activities=[
        ...state.quizzes.filter(quiz=>quizLive(quiz)).map(quiz=>{
          const sub=submissionFor(studentId,quiz.id),corrected=sub&&gradeAvailable(sub);
          return {id:quiz.id,title:quiz.title,type:'Questionário',due:quiz.dueDate||'',status:!sub?'Pendente':corrected?'Corrigido':'Aguarda correção',statusClass:!sub?'pending':corrected?'recorded':'pending',action:!sub?'start-quiz':corrected?'view-submission':'',actionLabel:!sub?'Responder':corrected?'Ver nota':''};
        }),
        ...state.tasks.filter(task=>task.published&&(task.type==='individual'?(Array.isArray(task.assignedStudents)?task.assignedStudents:state.students.map(student=>student.id)).includes(studentId):(groupForStudent(studentId)&&(Array.isArray(task.assignedGroups)?task.assignedGroups:GROUPS).includes(groupForStudent(studentId))))&&(!task.dueDate||task.dueDate>=today())).map(task=>{
          const sub=taskSubmissionFor(task,studentId),submitted=Boolean(sub?.cloudStored&&sub.assetId);
          return {id:task.id,title:task.title,type:task.type==='group'?'Trabalho em grupo · Grupo '+groupForStudent(studentId):'Trabalho individual',due:task.dueDate||'',status:submitted?'Entregue':sub?'A sincronizar':'Pendente',statusClass:submitted?'done':'pending',action:'open-task',actionLabel:submitted?'Ver entrega':'Abrir tarefa'};
        })
      ].sort((a,b)=>(a.due||'9999-12-31').localeCompare(b.due||'9999-12-31')||a.title.localeCompare(b.title,'pt-PT')).slice(0,8);
      const activityRows=activities.map(item=>{
        const action=item.action?'<button class="btn btn-quiet btn-small" data-action="'+item.action+'" data-id="'+esc(item.id)+'">'+item.actionLabel+'</button>':'';
        return '<tr><td data-label="Atividade"><div class="person-name">'+esc(item.title)+'</div><div class="person-detail">'+esc(item.type)+(item.due?' · Prazo '+fmtDate(item.due):'')+'</div></td><td data-label="Estado"><span class="activity-badge '+item.statusClass+'">'+item.status+'</span>'+(action?'<div class="dashboard-row-action">'+action+'</div>':'')+'</td></tr>';
      }).join('');

          '</section>'+
        '</div>';
    }

    function renderCorrection(){const sub=state.submissions.find(item=>item.id===activeSubmissionId),q=quizById(sub?.quizId),st=studentById(sub?.studentId);if(!sub||!q||!st)return `<div class="empty"><strong>Esta entrega já não está disponível.</strong><p>Volte aos resultados para escolher outra resposta.</p><button type="button" class="text-action" data-nav="results">Resultados</button></div>`;const answers=q.questions.map((item,i)=>`<section class="question-card"><div class="q-number">Pergunta ${i+1} de ${q.questions.length}</div><div class="q-prompt">${esc(item.prompt)}</div>${item.imageUrl?`<figure style="margin:12px 0"><img src="${esc(item.imageUrl)}" alt="${esc(item.imageAlt||'Imagem de apoio da pergunta')}" style="display:block;max-width:100%;max-height:360px;object-fit:contain;border:1px solid var(--line);border-radius:10px"><figcaption class="muted" style="font-size:11px;margin-top:5px">Imagem de apoio</figcaption></figure>`:''}<p style="margin:10px 0 0;color:var(--ink)"><strong>Resposta do aluno:</strong> ${esc(answerLabel(item,sub.answers?.[i]))}</p></section>`).join('');return `<div class="workflow-page correction-page"><nav class="workflow-breadcrumb" aria-label="Navegação local"><button type="button" data-nav="results">Resultados</button><span aria-hidden="true">/</span><span aria-current="page">Correção</span></nav><div class="page-head workflow-head"><div><div class="eyebrow">Correção manual · ${esc(st.className||className)}</div><h1 class="h1">${esc(q.title)}</h1><p class="subhead">${esc(st.name)} · Entregue em ${fmtDate(String(sub.submittedAt||'').slice(0,10))}</p></div></div><div class="workflow-guidance"><div class="workflow-guidance-title">Reveja a entrega antes de lançar a nota</div><p>A resposta correta não é mostrada nesta página. Registe a avaliação e, se necessário, consulte os dados de credibilidade da sessão.</p><button class="btn btn-secondary btn-small" data-action="open-integrity-report" data-id="${esc(sub.id)}">Ver credibilidade da pr     const formatMark=score=>Number(score).toLocaleString('pt-PT',{maximumFractionDigits:2});
    const averageMark=values=>values.length?Math.round(values.reduce((sum,value)=>sum+value,0)/values.length*100)/100:null;
    const gradeFieldConfig={quiz:{key:'quizScoreOverride',label:'1.ª avaliação'},second:{key:'secondWrittenScore',label:'2.ª prova escrita'},written:{key:'writtenScore',label:'3.ª prova escrita'},practical:{key:'practicalScoreOverride',label:'Avaliação prática'},other:{key:'otherScoreOverride',label:'Outros'}};
    const validAssessmentMark=value=>typeof value==='number'&&Number.isFinite(value)&&value>=0&&value<=20?value:null;
    function attendanceSummaryFor(sid){
      const planned=Math.max(1,Number(state.attendanceSettings.plannedLessons)||40);
      let presences=0,absences=0,points=0;
      for(const session of state.attendanceSessions){
        const periods=Math.max(1,Math.min(4,Number(session.periods)||2)),record=session.records?.[sid]||{};
        for(let i=0;i<periods;i++){
          const status=record.statuses?.[i];
          if(status==='present'){presences++;const value=Number(record.points?.[i]);if(Number.isFinite(value)&&value>=0&&value<=5)points+=value}
          else if(status==='absent')absences++;

      }
      const limitPercent=Math.max(1,Math.min(100,Number(state.attendanceSettings.absenceLimitPercent)||45));
      const absenceLimit=Math.ceil(planned*limitPercent/100),marked=presences+absences;
      const score=marked?(absences>=absenceLimit?0:Math.min(10,presences/planned*10)+Math.min(10,points/(planned*5)*10)):null;

    }
    function weightedAssessmentAverage(grades){
      const components=[{score:grades.quiz,weight:.175},{score:grades.second,weight:.175},{score:grades.written,weight:.175},{score:grades.practical,weight:.30},{score:grades.other,weight:.175}].filter(item=>validAssessmentMark(item.score)!==null);
      if(!components.length)return null;
      const totalWeight=components.reduce((sum,item)=>sum+item.weight,0);
      return Math.round(components.reduce((sum,item)=>sum+item.score*item.weight,0)/totalWeight*100)/100;
    }
    function assessmentForStudent(sid){

      const groupScores=state.taskSubmissions.filter(item=>item.team===group&&state.tasks.find(task=>task.id===item.taskId)?.type==='group'&&Number.isFinite(item.score)).map(item=>item.score);
      const quizAutomatic=averageMark(quizScores),practicalAutomatic=averageMark(groupScores),attendance=attendanceSummaryFor(sid);

    function renderGradebook(){
      const rows=state.students.map((student,index)=>{
        const grades=assessmentForStudent(student.id);
        const average=grades.average===null?'<span class="gradebook-average">—</span>':'<span class="gradebook-average">'+formatMark(grades.average)+'<small>/20</small></span>';

    function renderAuthScreen(error='',loading=false){modalRoot.innerHTML='';root.innerHTML=`<div class="auth-page"><header class="auth-header"><img src="assets/universidade-logo.png" alt="Emblema da Universidade Agostinho Neto"><div class="auth-institution"><strong>Universidade Agostinho Neto</strong><span>Faculdade de Ciências Naturais</span></div><img src="assets/faculdade-logo.png" alt="Emblema da Faculdade de Ciências Naturais"></header><main class="auth-main"><section class="auth-card" aria-labelledby="auth-title"><div class="auth-kicker">Departamento de Geofísica · 5.º Ano</div><h1 id="auth-title">Acesso à Sala de Aula</h1><p class="auth-intro">Diagrafias · Ano lectivo 2026/2027</p>${loading?'<div class="auth-loading" role="status">A verificar a sua sessão…</div>':`<form id="login-form" class="auth-form"><div class="field"><label for="login-username">Nome de utilizador ou e-mail</label><input id="login-username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="120" required ${authConfig?'':'disabled'}></div><div class="field"><label for="login-password">Palavra-passe</label><input id="login-password" name="password" type="password" autocomplete="current-password" required ${authConfig?'':'disabled'}></div><button class="btn btn-primary" type="submit" ${authConfig?'':'disabled'}>Entrar</button></form><p class="auth-help">Use a credencial individual fornecida pelo professor. No primeiro acesso, todos os utilizadores terão de criar uma palavra-passe pessoal.</p><button type="button" class="auth-recovery-link" data-auth-action="recovery">Não consigo entrar</button>`}${error?`<div class="auth-error" role="alert">${esc(error)}</div>`:''}<div class="auth-legal">Acesso restrito a utilizadores autorizados.</div></section></main><footer class="auth-footer">Desenvolvido pela <strong>Virtus Group LDA</strong></footer></div>`}
    function renderPasswordRecovery(message='',error=''){modalRoot.innerHTML='';root.innerHTML=`<div class="auth-page"><header class="auth-header"><img src="assets/universidade-logo.png" alt="Emblema da Universidade Agostinho Neto"><div class="auth-institution"><strong>Universidade Agostinho Neto</strong><span>Faculdade de Ciências Naturais</span></div><img src="assets/faculdade-logo.png" alt="Emblema da Faculdade de Ciências Naturais"></header><main class="auth-main"><section class="auth-card" aria-labelledby="recovery-title"><div class="auth-kicker">Recuperar acesso</div><h1 id="recovery-title">Não consegue entrar?</h1><p class="auth-intro">Indique o seu utilizador ou e-mail. Se a conta existir, será gerada uma palavra-passe temporária e enviada ao coordenador da plataforma.</p><form id="password-recovery-form" class="auth-form"><div class="field"><label for="recovery-identity">Nome de utilizador ou e-mail</label><input id="recovery-identity" name="identity" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="120" required></div><button class="btn btn-primary" type="submit">Pedir recuperação</button></form>${message?`<div class="auth-success" role="status">${esc(message)}</div>`:''}${error?`<div class="auth-error" role="alert">${esc(error)}</div>`:''}<button type="button" class="auth-recovery-link" data-auth-action="back-to-login">Voltar ao acesso</button></section></main><footer class="auth-footer">Desenvolvido pela <strong>Virtus Group LDA</strong></footer></div>`}
    function renderPasswordChange(){root.innerHTML=`<div class="auth-page"><header class="auth-header"><img src="assets/universidade-logo.png" alt="Emblema da Universidade Agostinho Neto"><div class="auth-institution"><strong>Universidade Agostinho Neto</strong><span>Faculdade de Ciências Naturais</span></div><img src="assets/faculdade-logo.png" alt="Emblema da Faculdade de Ciências Naturais"></header><main class="auth-main"><section class="auth-card" aria-labelledby="change-title"><div class="auth-kicker">Primeiro acesso</div><h1 id="change-title">Defina a sua palavra-passe</h1><p class="auth-intro">Por segurança, substitua a palavra-passe temporária antes de continuar.</p><p class="auth-profile-meta">Conta: <strong>${esc(authProfile?.full_name||authProfile?.username||'')}</strong></p><form id="password-change-form" class="auth-form"><div class="field"><label for="new-password">Nova palavra-passe</label><input id="new-password" name="password" type="password" autocomplete="new-password" minlength="10" required></div><div class="field"><label for="confirm-password">Confirmar palavra-passe</label><input id="confirm-password" name="confirmation" type="password" autocomplete="new-password" minlength="10" required></div><p class="auth-password-rules">Use pelo menos 10 caracteres e evite palavras-passe partilhadas.</p><button class="btn btn-primary" type="submit">Guardar e continuar</button></form><div id="password-error"></div><div class="auth-legal">A palavra-passe é guardada pelo serviço de autenticação, nunca no código da página.</div></section></main><footer class="auth-footer">Desenvolvido pela <strong>Virtus Group LDA</strong></footer></div>`}
    function replaceState(next){if(!next||typeof next!=='object')return;for(const key of Object.keys(state))delete state[key];Object.assign(state,next);if(!Array.isArray(state.notifications))state.notifications=[];if(!state.assessmentDates||typeof state.assessmentDates!=='object'||Array.isArray(state.assessmentDates))state.assessmentDates={}}
    function normalizeStudentName(name){return String(name||'').normalize('NFC').trim().toLocaleLowerCase('pt-PT')}
    function reconcileTeacherRoster(roster){if(!Array.isArray(roster)||!roster.length)return false;const before=JSON.stringify({students:state.students,groups:state.groupAllocations});const oldByName=new Map((state.students||[]).map(student=>[normalizeStudentName(student.name),student]));const oldGroups=state.groupAllocations||{};const idMap=new Map();const students=roster.map(record=>{const previous=oldByName.get(normalizeStudentName(record.name));if(previous&&previous.id!==record.id)idMap.set(previous.id,record.id);return{...(previous||{}),...record}});const validIds=new Set(students.map(student=>student.id));const groups={};for(const [id,group] of Object.entries(oldGroups)){const mapped=idMap.get(id)||id;if(validIds.has(mapped)&&['A','B','C'].includes(group))groups[mapped]=group}state.students=students;state.groupAllocations=groups;for(const student of students)if(!state.groupAllocations[student.id])assignLeastFilledGroup(student.id);for(const collection of ['submissions','taskSubmissions','provisionalGrades','assessmentGrades'])for(const record of state[collection]||[])if(idMap.has(record.studentId))record.studentId=idMap.get(record.studentId);for(const session of state.attendanceSessions||[]){const remapped={};for(const [id,record] of Object.entries(session.records||{}))remapped[idMap.get(id)||id]=record;session.records=remapped}return before!==JSON.stringify({students:state.students,groups:state.groupAllocations})}
    function setLoginError(message){const target=root.querySelector('#login-error');if(target)target.innerHTML=`<div class="auth-error" role="alert">${esc(message)}</div>`;else renderAuthScreen(message)}
    async function loadAuthConfig(){const response=await fetch('/api/auth/config',{cache:'no-store'});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'A autenticação ainda não está configurada.');if(!/^https:\/\//.test(data.url||'')||!data.anonKey)throw new Error('A configuração do serviço de autenticação está incompleta.');authConfig=data}
    async function initializeAuth(){renderAuthScreen('',true);try{await loadAuthConfig()}catch(error){renderAuthScreen('O acesso seguro ainda não foi activado neste deployment. Configure a ligação ao Supabase e publique novamente.');return}let saved=null;try{saved=JSON.parse(localStorage.getItem(AUTH_SESSION_KEY)||'null')}catch{}if(saved?.access_token){authSession=saved;if(authSession.expires_at<Date.now()/1000+30&&!await refreshAuthSession()){renderAuthScreen('A sua sessão terminou. Entre novamente.');return}try{authProfile=await apiRequest('/api/auth/session');if(authProfile.must_change_password){renderPasswordChange();return}await enterPlatform();return}catch{clearAuthSession()}}renderAuthScreen()}
    async function handleLogin(form){const button=form.querySelector('button[type="submit"]'),identity=String(new FormData(form).get('username')||'').trim().toLowerCase(),password=String(new FormData(form).get('password')||''),usernameValid=/^[a-z0-9._-]{3,60}$/.test(identity),emailValid=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(identity);if(!usernameValid&&!emailValid){setLoginError('Introduza o nome de utilizador ou e-mail indicado pelo professor.');return}button.disabled=true;button.textContent='A validar…';try{const response=await fetch(`${authConfig.url}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:authConfig.anonKey,'Content-Type':'application/json'},body:JSON.stringify({email:loginEmail(identity),password})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error('Nome de utilizador ou palavra-passe inválidos.');saveAuthSession(data);authProfile=await apiRequest('/api/auth/session');if(authProfile.must_change_password){renderPasswordChange();return}await enterPlatform()}catch(error){clearAuthSession();renderAuthScreen(error.message||'Não foi possível iniciar sessão.')}finally{if(button.isConnected){button.disabled=false;button.textContent='Entrar'}}}
    async function handlePasswordRecovery(form){const button=form.querySelector('button[type="submit"]'),identity=String(new FormData(form).get('identity')||'').trim();button.disabled=true;button.textContent='A pedir…';try{await fetch('/api/auth/request-password-reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identity})}).then(async response=>{const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Não foi possível iniciar a recuperação.')});renderPasswordRecovery('O pedido foi registado. O coordenador receberá a nova palavra-passe temporária por e-mail.')}catch(error){renderPasswordRecovery('',error.message||'Não foi possível iniciar a recuperação.')}finally{if(button.isConnected){button.disabled=false;button.textContent='Pedir recuperação'}}}
    async function handlePasswordChange(form){const values=new FormData(form),password=String(values.get('password')||''),confirmation=String(values.get('confirmation')||'');const errorNode=root.querySelector('#password-error');if(password.length<10||password!==confirmation){if(errorNode)errorNode.innerHTML='<div class="auth-error" role="alert">As palavras-passe devem coincidir e ter pelo menos 10 caracteres.</div>';return}const button=form.querySelector('button[type="submit"]');button.disabled=true;button.textContent='A guardar…';try{await apiRequest('/api/auth/change-password',{method:'POST',body:JSON.stringify({password})});authProfile=await apiRequest('/api/auth/session');await enterPlatform()}catch(error){if(errorNode)errorNode.innerHTML=`<div class="auth-error" role="alert">${esc(error.message)}</div>`}finally{if(button.isConnected){button.disabled=false;button.textContent='Guardar e continuar'}}}
    async function enterPlatform(){const result=await apiRequest('/api/state');cloudRevision=result.revision||null;mode=authProfile.role==='teacher_admin'?'teacher':authProfile.role;view='dashboard';studentId=authProfile.role==='student'?authProfile.id:'';if(mode==='teacher'){if(result.state)replaceState(result.state);const changed=reconcileTeacherRoster(result.roster);if(!result.state){if(!state.students.length&&result.roster?.length)state.students=result.roster;for(const student of state.students)if(!state.groupAllocations[student.id])assignLeastFilledGroup(student.id);const saved=await apiRequest('/api/state',{method:'PUT',body:JSON.stringify({state,expectedRevision:cloudRevision})});cloudRevision=saved.revision||cloudRevision}else if(changed){const saved=await apiRequest('/api/state',{method:'PUT',body:JSON.stringify({state,expectedRevision:cloudRevision})});cloudRevision=saved.revision||cloudRevision}}else{if(!result.state)throw new Error('A turma ainda está a ser preparada pelo professor.');replaceState(result.state);if(!studentById(studentId))throw new Error('A conta não está ligada a um aluno matriculado.')}cloudReady=true;startCloudPolling();try{localStorage.removeItem(KEY)}catch{};render()}
    async function scheduleCloudSync(){clearTimeout(cloudSyncTimer);cloudSyncTimer=setTimeout(()=>{cloudSyncTimer=null;const snapshot=JSON.stringify(state);cloudSyncBusy=true;cloudSyncChain=cloudSyncChain.then(async()=>{const saved=await apiRequest('/api/state',{method:'PUT',body:JSON.stringify({state:JSON.parse(snapshot),expectedRevision:cloudRevision})});cloudRevision=saved.revision||cloudRevision}).catch(error=>{if(error.message.includes('sessão')){signOut();return}if(error.message.includes('Outro docente'))cloudReady=false;toast(error.message.includes('Outro docente')?error.message+' Esta gravação não foi enviada.': 'Não foi possível sincronizar. Verifique a ligação e tente guardar novamente.',true)}).finally(()=>{cloudSyncBusy=false})},350)}

    async function signOut(){stopCloudPolling();cloudReady=false;if(activeIntegritySession){finishIntegritySession();activeQuizId=''}try{if(authConfig&&authSession?.access_token)await fetch(`${authConfig.url}/auth/v1/logout`,{method:'POST',headers:{apikey:authConfig.anonKey,Authorization:`Bearer ${authSession.access_token}`}})}catch{}clearAuthSession();renderAuthScreen()}
    root.addEventListener('submit',event=>{if(event.target.id==='login-form'){event.preventDefault();handleLogin(event.target)}else if(event.target.id==='password-change-form'){event.preventDefault();handlePasswordChange(event.target)}else if(event.target.id==='password-recovery-form'){event.preventDefault();handlePasswordRecovery(event.target)}});
    root.addEventListener('click',event=>{if(event.target.closest('[data-auth-action="logout"]'))signOut();if(event.target.closest('[data-auth-action="recovery"]'))renderPasswordRecovery();if(event.target.closest('[data-auth-action="back-to-login"]'))renderAuthScreen()});
    let deploymentVersion=null;
    function showDeploymentUpdate(){
      if(document.getElementById('deployment-update-notice'))return;
      const notice=document.createElement('aside');notice.id='deployment-update-notice';notice.setAttribute('role','status');notice.setAttribute('aria-live','polite');
      Object.assign(notice.style,{position:'fixed',left:'50%',bottom:'18px',transform:'translateX(-50%)',zIndex:'2200',display:'flex',alignItems:'center',gap:'14px',maxWidth:'calc(100vw - 24px)',padding:'12px 16px',borderRadius:'12px',background:'#142b47',color:'#fff',boxShadow:'0 10px 32px rgba(0,0,0,.24)',font:'600 13px Inter, sans-serif'});
      const message=document.createElement('span');message.textContent='Há uma versão nova da plataforma. Atualize depois de terminar esta avaliação.';
      const button=document.createElement('button');button.type='button';button.textContent='Atualizar';button.setAttribute('aria-label','Atualizar a plataforma');Object.assign(button.style,{border:'0',borderRadius:'8px',padding:'8px 12px',background:'#fff',color:'#142b47',font:'700 13px Inter, sans-serif',cursor:'pointer'});
      button.addEventListener('click',()=>{if(activeIntegritySession){toast('Termine ou saia da prova antes de atualizar.',true);return}location.reload()});
      notice.append(message,button);document.body.appendChild(notice);
    }
    async function checkDeploymentVersion(){
      try{const response=await fetch('/api/version',{cache:'no-store',headers:{'Cache-Control':'no-cache'}});if(!response.ok)return;const payload=await response.json();if(!payload.version||payload.version==='unknown')return;if(deploymentVersion===null)deploymentVersion=payload.version;else if(deploymentVersion!==payload.version)showDeploymentUpdate()}catch{}
    }
    function initializeDeploymentVersionWatch(){checkDeploymentVersion();setInterval(checkDeploymentVersion,60000);window.addEventListener('focus',checkDeploymentVersion);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkDeploymentVersion()})}
    initializeAuth();
    initializeDeploymentVersionWatch();
  })();
  </script>
