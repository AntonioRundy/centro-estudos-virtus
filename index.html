<!doctype html>
<html lang="pt">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Centro de Estudos Virtus</title></head>
<body style="margin:0;background:#f4f5f2;color:#15304f;font-family:Arial,sans-serif">
<main id="app" aria-live="polite" style="min-height:100vh;display:grid;place-items:center;padding:24px">A carregar o Centro de Estudos Virtus…</main>
<script>
(async()=>{
  const response=await fetch('/assets/app-shell.gzbin',{cache:'no-store'});
  if(!response.ok)throw new Error('Não foi possível carregar a plataforma.');
  if(!('DecompressionStream' in window))throw new Error('Atualize o navegador para abrir esta plataforma.');
  const html=await new Response(response.body.pipeThrough(new DecompressionStream('gzip'))).text();
  document.open();document.write(html);document.close();
})().catch(error=>{document.getElementById('app').innerHTML='<section style="max-width:520px;background:#fff;border:1px solid #dce4e7;border-radius:14px;padding:24px"><h1 style="margin-top:0">Não foi possível iniciar a plataforma</h1><p>Atualize a página. Se o erro persistir, contacte o coordenador.</p><small>'+error.message+'</small></section>'});
</script>
</body>
</html>
